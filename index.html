<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Nexus · Copiloto</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            background: #0b0e14;
            color: #e2e8f0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 12px;
        }
        #widget {
            max-width: 480px;
            width: 100%;
            height: 90vh;
            background: #141a24;
            border-radius: 24px;
            border: 1px solid #2a3440;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0,0,0,0.7);
        }
        #header {
            padding: 18px 20px;
            border-bottom: 1px solid #2a3440;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f151e;
        }
        #header h1 {
            font-size: 18px;
            font-weight: 600;
            letter-spacing: -0.3px;
        }
        #header h1 span { color: #60a5fa; }
        #status {
            font-size: 11px;
            color: #6b7a8f;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        #status .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #22c55e;
            display: inline-block;
        }
        #chat {
            flex: 1;
            overflow-y: auto;
            padding: 16px 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #0f151e;
        }
        .message {
            padding: 12px 16px;
            border-radius: 16px;
            max-width: 92%;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
        }
        .user { 
            align-self: flex-end; 
            background: #2563eb; 
            color: white;
            border-bottom-right-radius: 4px;
        }
        .nexus { 
            align-self: flex-start; 
            background: #1e293b; 
            border: 1px solid #334155;
            border-bottom-left-radius: 4px;
            color: #e2e8f0;
        }
        .nexus pre {
            background: #0f151e;
            padding: 10px 12px;
            border-radius: 8px;
            margin-top: 8px;
            font-size: 12px;
            overflow-x: auto;
            color: #b0c4de;
            border-left: 3px solid #60a5fa;
        }
        #input-area {
            padding: 14px 20px;
            border-top: 1px solid #2a3440;
            display: flex;
            gap: 10px;
            background: #0f151e;
        }
        #prompt {
            flex: 1;
            padding: 12px 16px;
            border-radius: 30px;
            border: 1px solid #2a3440;
            background: #1a2330;
            color: #e2e8f0;
            font-size: 14px;
            outline: none;
            resize: none;
            min-height: 44px;
            max-height: 120px;
        }
        #prompt:focus { border-color: #60a5fa; }
        #send {
            padding: 12px 20px;
            border-radius: 30px;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }
        #send:active { background: #1d4ed8; }
        #send:disabled { opacity: 0.5; pointer-events: none; }
        .typing {
            color: #6b7a8f;
            font-size: 13px;
            align-self: flex-start;
            padding: 8px 16px;
        }
        .typing::after {
            content: '...';
            animation: dots 1.2s steps(3) infinite;
        }
        @keyframes dots { 0% { opacity: 0; } 100% { opacity: 1; } }
        @media (max-width: 480px) {
            #widget { height: 100vh; border-radius: 0; border: none; }
        }
    </style>
</head>
<body>

<div id="widget">
    <div id="header">
        <h1>🧠 <span>Nexus</span> · copiloto</h1>
        <div id="status"><span class="dot"></span> activo</div>
    </div>
    <div id="chat"></div>
    <div id="input-area">
        <textarea id="prompt" rows="1" placeholder="Pega código o escribe..."></textarea>
        <button id="send">→</button>
    </div>
</div>

<script>
    const chat = document.getElementById('chat');
    const prompt = document.getElementById('prompt');
    const sendBtn = document.getElementById('send');
    const API_URL = '/api/nexus'; // Ruta en Vercel

    function addMessage(text, sender = 'nexus', extra = '') {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        div.textContent = text;
        if (extra) {
            const pre = document.createElement('pre');
            pre.textContent = extra;
            div.appendChild(pre);
        }
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function showTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing-indicator';
        div.textContent = 'Nexus está pensando';
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
    }

    function hideTyping() {
        const el = document.getElementById('typing-indicator');
        if (el) el.remove();
    }

    async function sendToNexus(text) {
        if (!text.trim()) return;
        addMessage(text, 'user');
        prompt.value = '';
        prompt.style.height = 'auto';
        sendBtn.disabled = true;
        showTyping();

        try {
            const resp = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt: text })
            });
            const data = await resp.json();
            hideTyping();
            if (data.error) {
                addMessage(`⚠️ Error: ${data.error}`, 'nexus');
            } else {
                const reply = data.response || 'No entendí eso.';
                const code = data.code_snippet || '';
                addMessage(reply, 'nexus', code);
            }
        } catch (e) {
            hideTyping();
            addMessage(`❌ No pude conectar con el servidor. ¿Vercel está funcionando?`, 'nexus');
        } finally {
            sendBtn.disabled = false;
        }
    }

    sendBtn.addEventListener('click', () => sendToNexus(prompt.value));
    prompt.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendToNexus(prompt.value);
        }
        // auto-expand
        prompt.style.height = 'auto';
        prompt.style.height = prompt.scrollHeight + 'px';
    });

    // Mensaje de bienvenida
    addMessage('👋 Tarek. Soy Nexus. Copiloto activado. Comparte código o descríbeme lo que estás construyendo.', 'nexus');
</script>
</body>
  </html>
